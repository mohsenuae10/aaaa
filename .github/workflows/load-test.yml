# اختبار تحمّل الزوّار من خوادم GitHub المجانية (نسخة مُبسَّطة لمستودع aaaa العام)
# لا مهمّة تقسيم منفصلة، لا jq، لا مصفوفة ديناميكية — ٥ خوادم ثابتة (IP مستقلّ لكل واحد).
# الأسرار: SUPABASE_URL + SUPABASE_KEY (مضبوطة). رحلة الزائر من whatsapp-service/k6/stress.js.

name: اختبار تحمّل الزوّار (k6)

on:
  workflow_dispatch:
    inputs:
      visitors:
        description: 'عدد الزوّار الكلي (يُقسَّم على ٥ خوادم)'
        default: '1000'
      duration:
        description: 'مدّة المحاكاة بالثواني'
        default: '180'
      think:
        description: 'زمن تفكير الزائر بين الشاشات (ثانية)'
        default: '3'
      detail:
        description: 'فتح صنف من القائمة لقراءة منتج كامل (true/false)'
        default: 'true'

permissions:
  contents: read

jobs:
  load:
    name: زوّار (خادم ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4

      - name: تنزيل k6
        run: |
          curl -sL https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz \
            | tar xz --strip-components=1 k6-v0.54.0-linux-amd64/k6
          ./k6 version

      - name: تشغيل المحاكاة
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_KEY }}
          SCENARIO: visitor
          THINK: ${{ github.event.inputs.think }}
          DETAIL: ${{ github.event.inputs.detail == 'true' && '1' || '0' }}
          RAMP: '1'
          DUR: ${{ github.event.inputs.duration }}
          TOTAL: ${{ github.event.inputs.visitors }}
        run: |
          export VUS=$(( TOTAL / 5 ))
          if [ "$VUS" -lt 1 ]; then export VUS=1; fi
          echo "هذا الخادم يحاكي $VUS زائرًا (من $TOTAL على ٥ خوادم)"
          # threshold فاشل يُخرج k6 برمز 99 — ليس فشل تشغيل، لذا || true
          ./k6 run --no-color --summary-export "summary-${{ matrix.shard }}.json" \
            whatsapp-service/k6/stress.js || true
          echo "--- ملخّص الخادم ${{ matrix.shard }} ---"
          cat "summary-${{ matrix.shard }}.json" 2>/dev/null | head -c 400 || echo "لا ملخّص"

      - uses: actions/upload-artifact@v4
        with:
          name: summary-${{ matrix.shard }}
          path: summary-${{ matrix.shard }}.json
          if-no-files-found: warn

  report:
    name: التقرير المجمّع
    needs: load
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: summary-*
          merge-multiple: true

      - name: تجميع النتائج
        run: |
          python3 - << 'PY' >> $GITHUB_STEP_SUMMARY
          import glob, json
          rows, tot = [], {'reqs':0,'ok':0,'waf':0,'rate':0,'srv':0,'auth':0,'net':0,'bytes':0}
          p95s = []
          for f in sorted(glob.glob('summary-*.json')):
              try: m = json.load(open(f))['metrics']
              except Exception: continue
              g = lambda n, k, d=0: (m.get(n) or {}).get(k, d)
              reqs = g('http_reqs','count'); p95 = g('http_req_duration','p(95)')
              cls = {k: g('r_'+k,'count') for k in ('ok','waf','rate','srv','auth','net')}
              rows.append((f.replace('summary-','').replace('.json',''), reqs, g('http_reqs','rate'), p95, cls))
              tot['reqs'] += reqs; tot['bytes'] += g('data_received','count')
              for k in cls: tot[k] += cls[k]
              if p95: p95s.append(p95)
          print('## نتيجة اختبار الزوّار\n')
          if not rows:
              print('> لا نتائج — راجع سجلّ الخوادم أعلاه.'); raise SystemExit
          print('| الخادم | الطلبات | طلبات/ث | p95 | نجاح | جدار ناري | 5xx | 429 | شبكة |')
          print('|---|---|---|---|---|---|---|---|---|')
          for n, reqs, rate, p95, c in rows:
              print(f"| {n} | {reqs:,.0f} | {rate:,.1f} | {p95:,.0f}ms | {c['ok']:,.0f} | {c['waf']:,.0f} | {c['srv']:,.0f} | {c['rate']:,.0f} | {c['net']:,.0f} |")
          R = tot['reqs'] or 1
          waf_pct = tot['waf']/R*100; hard_pct = (tot['srv']+tot['net']+tot['rate'])/R*100
          err_pct = (R - tot['ok'])/R*100; p95 = max(p95s) if p95s else 0
          print(f"\n**الإجمالي:** {tot['reqs']:,.0f} طلبًا · أسوأ p95 **{p95:,.0f}ms** · فشل **{err_pct:.1f}٪** · {tot['bytes']/1e6:,.1f}MB\n")
          if waf_pct > 50:
              print(f"🧱 **الاختبار لم يصل إلى القاعدة** — {waf_pct:.0f}٪ رُدّت بجدار Cloudflare الناري (403). زِد الخوادم أو ارفع زمن التفكير؛ ليست نتيجة عن قدرة القاعدة.")
          elif hard_pct > 5 or p95 > 3000:
              print(f"❌ **لا تتحمّل هذا العدد** — تعثّر فعلي من الخدمة {hard_pct:.1f}٪ وأسوأ p95 {p95:,.0f}ms.")
          elif err_pct > 1 or p95 > 1200:
              print(f"⚠️ **تتحمّل لكن بضغط ملحوظ** — فشل {err_pct:.1f}٪ وp95 {p95:,.0f}ms.")
          else:
              print(f"✅ **تتحمّل** — فشل {err_pct:.1f}٪ وp95 {p95:,.0f}ms على {tot['reqs']:,.0f} طلبًا حقيقيًّا.")
          PY
